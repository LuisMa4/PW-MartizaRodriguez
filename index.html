<!doctype html>
<html lang="es" class="es-inicio">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maritza Rodríguez Fotografía | Tacna, Perú</title>
  <meta name="description" content="Fotografía de bodas, quinceañeras, familias e instituciones en Tacna, Perú. Mira el trabajo de Maritza Rodríguez y coordina tu sesión.">
  <meta name="theme-color" content="#000000">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_PE">
  <meta property="og:title" content="Maritza Rodríguez Fotografía">
  <meta property="og:description" content="La belleza de la vida a través de mi lente.">
  <meta property="og:image" content="https://luisma4.github.io/PW-MartizaRodriguez/assets/og/inicio.jpg">
  <link rel="icon" href="assets/logos/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/sitio.css">
  <script>
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('con-iris');
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Maritza Rodríguez Fotografía",
      "description": "Fotografía de bodas, quinceañeras, familias e instituciones.",
      "address": { "@type": "PostalAddress", "addressLocality": "Tacna", "addressCountry": "PE" },
      "telephone": "+51974212545",
      "sameAs": ["https://www.instagram.com/maritza._rodriguez/"]
    }
  </script>
</head>
<body>
  <canvas id="iris" aria-hidden="true"></canvas>

  <main>
    <h1 class="solo-lectores">Maritza Rodríguez Fotografía</h1>

    <section class="escenario" id="escenario" style="--n: 5" aria-label="Categorías de fotografía">
      <div class="escenario__fijo">
        <article class="escena escena--inicio activa">
          <div class="escena__marca" data-sobre>
            <img src="assets/logos/firma.webp" alt="Maritza Rodríguez Fotografía" width="1100" height="384">
            <p>La belleza de la vida a través de mi lente.</p>
          </div>
          <button class="desliza no-iris-oculto" type="button" data-sobre>
            Desliza para ver su trabajo
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l8 8 8-8"/></svg>
          </button>
        </article>

        <article class="escena" data-sala="bodas">
          <div class="escena__texto">
            <h2><a class="escena__titulo" href="bodas.html" data-ajustar="0.3">Bodas</a></h2>
            <div class="escena__pie">
              <p>Preboda, ceremonia y fiesta.</p>
              <a class="boton" href="bodas.html">Ver galería</a>
            </div>
          </div>
        </article>

        <article class="escena" data-sala="quinceaneras">
          <div class="escena__texto">
            <h2><a class="escena__titulo" href="quinceaneras.html" data-ajustar="0.3">Quinceañeras</a></h2>
            <div class="escena__pie">
              <p>Sesión, playa y fiesta.</p>
              <a class="boton" href="quinceaneras.html">Ver galería</a>
            </div>
          </div>
        </article>

        <article class="escena" data-sala="familiares">
          <div class="escena__texto">
            <h2><a class="escena__titulo" href="familiares.html" data-ajustar="0.3">Familiares</a></h2>
            <div class="escena__pie">
              <p>Padres, hijos y hermanos, juntos.</p>
              <a class="boton" href="familiares.html">Ver galería</a>
            </div>
          </div>
        </article>

        <article class="escena escena--cerrada" data-sala="institucionales">
          <div class="lente-m"><img src="assets/logos/monograma.webp" alt="" width="300" height="240"></div>
          <div class="escena__texto">
            <h2><a class="escena__titulo" href="institucionales.html" data-ajustar="0.3">Institucionales</a></h2>
            <div class="escena__pie">
              <p>Esta galería se está preparando.</p>
              <a class="boton" href="institucionales.html">Saber más</a>
            </div>
          </div>
        </article>

        <canvas class="iris-escena" aria-hidden="true"></canvas>
      </div>
    </section>
  </main>

  <footer id="cierre"></footer>

  <noscript><p><a href="https://www.instagram.com/maritza._rodriguez/">Ver a Maritza Rodríguez en Instagram</a></p></noscript>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/fotos.js"></script>
  <script src="assets/js/iris.js"></script>
  <script src="assets/js/sitio.js"></script>
</body>
</html>
